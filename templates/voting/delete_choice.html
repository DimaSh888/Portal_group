{% extends "base.html" %}

{% block title %}Delete Choice{% endblock %}

{% block content %}
<div class="poll-container">
    <h1>Delete Choice</h1>
    <p>Are you sure you want to delete the choice <strong>{{ choice.text }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="poll-actions">
            <button type="submit" class="poll-button poll-button-danger">Yes, Delete</button>
            <a href="{% url 'add_choice' poll.id %}" class="poll-back-button">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

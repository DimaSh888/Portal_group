{% extends "base.html" %}

{% block title %}Delete Poll{% endblock %}

{% block content %}
<div class="poll-container">
    <h1>Delete Poll</h1>
    <p>Are you sure you want to delete the poll <strong>{{ poll.title }}</strong>?</p>
    <p>This will also delete all choices and votes belonging to this poll.</p>

    <form method="post">
        {% csrf_token %}
        <div class="poll-actions">
            <button type="submit" class="poll-button poll-button-danger">Yes, Delete</button>
            <a href="{% url 'poll_list' %}" class="poll-back-button">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

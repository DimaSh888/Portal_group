{% extends "base.html" %}

{% block title %}Create Poll{% endblock %}

{% block content %}
<div class="poll-container">
    <h1>Create Poll</h1>

    <form method="post" class="poll-form">
        {% csrf_token %}

        <label for="poll-title">Poll title</label>
        <input id="poll-title" type="text" name="title" required>

        <label for="poll-description">Description</label>
        <textarea id="poll-description" name="description"></textarea>

        <div class="poll-actions">
            <button type="submit" class="poll-button">Create Poll</button>
            <a href="{% url 'poll_list' %}" class="poll-back-button">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

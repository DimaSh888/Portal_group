{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}Portal Group{% endblock %}</title>
</head>
<body>
<header class="site-header">
    <a class="brand" href="{% url 'main' %}">
        <span class="brand-mark">PortalGroup</span>
    </a>

    <nav class="main-nav">
        {% if user.is_authenticated %}

        <a href="{% url 'profile' %}">
            Profile
        </a>

        {% if user.is_superuser %}
            <a href="{% url 'register' %}">
                Registration
            </a>
        {% endif %}

        <a href="{% url 'logout' %}">
            Log out
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            Log in
        </a>

    {% endif %}

</nav>

</header>

<main class="page-shell">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>

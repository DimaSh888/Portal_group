{% extends "base.html" %}
{% block title %}{{ page_title }} — Portal Group{% endblock %}
{% block content %}
<section class="feature-form-page">
    <div class="form-card">
        <div class="form-heading">
            <span class="page-label">GALLERY</span>
            <h1>{{ page_title }}</h1>
        </div>
        <form method="post" enctype="multipart/form-data" class="feature-form">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-actions">
                <a class="secondary-button" href="{% url 'gallery' %}">Cancel</a>
                <button class="primary-button" type="submit">Save image</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}

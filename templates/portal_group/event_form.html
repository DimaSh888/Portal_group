{% extends "base.HTML" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<section class="form-card event-form-card">
    <a class="back-link" href="{% url 'event_calendar' %}">← Back to calendar</a>
    <h1>{{ page_title }}</h1>
    <p class="events-subtitle">Add the details so students can see the event.</p>
    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}<form method="post">
        {% csrf_token %}
        <div class="form-field">
            <label for="title">Title *</label>
            <input id="title" name="title" maxlength="120" required value="{% if event_data.title %}{{ event_data.title }}{% elif event %}{{ event.title }}{% endif %}">
        </div>
        <div class="form-field">
            <label for="description">Description *</label>
            <textarea id="description" name="description" rows="6" required>{% if event_data.description %}{{ event_data.description }}{% elif event %}{{ event.description }}{% endif %}</textarea>
        </div>
        <div class="form-field">
            <label for="event_date">Date *</label>
            <input id="event_date" name="event_date" type="date" required value="{% if event_data.event_date %}{{ event_data.event_date }}{% elif event %}{{ event.event_date|date:'Y-m-d' }}{% endif %}">
        </div>
        <div class="form-field">
            <label for="event_time">Time</label>
            <input id="event_time" name="event_time" type="time" value="{% if event_data.event_time %}{{ event_data.event_time }}{% elif event %}{{ event.event_time|time:'H:i' }}{% endif %}">
        </div>
        <div class="form-field">
            <label for="location">Location</label>
            <input id="location" name="location" maxlength="200" value="{% if event_data.location %}{{ event_data.location }}{% elif event %}{{ event.location }}{% endif %}"></div>
            <div class="form-actions">
                <a class="secondary-button" href="{% url 'event_calendar' %}">Cancel</a>
                <button class="primary-button" type="submit">Save event</button>
            </div>
        </form>
    </section>
{% endblock %}

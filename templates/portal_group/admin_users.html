{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}

<h1>Users</h1>

<div class="admin-users-list"></div>
{% for user in users %}

<div class="user-card">
    <h3>{{ user.username }}</h3>

    <p>Email: {{ user.email }}</p>

    <p>Role: {{ user.role }}</p>

    <div class="user-actions">
        <a href="{% url 'admin_edit_user' user.id %}" class="admin-button">
            Edit
        </a>

        <form action="{% url 'admin_delete_user' user.id %}" method="post"
            onsubmit="return confirm('Are you sure you want to delete {{ user.username }}?');">
            {% csrf_token %}
            <button type="submit" class="admin-button delete-button">
                Delete
            </button>
        </form>
    </div>
</div>

{% empty %}

    <p>No users found.</p>

{% endfor %}

</div>

{% endblock %}

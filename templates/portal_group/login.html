{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <h1>Log in</h1>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="post" class="auth-form">
        {% csrf_token %}

        <p>
            <label for="username">Username:</label>
            <input
                type="text"
                name="username"
                id="username"
                required
            >
        </p>

        <p>
            <label for="password">Password:</label>
            <input
                type="password"
                name="password"
                id="password"
                required
            >
        </p>

        <a href="{% url 'register_as_user' %}">Create an account</a> <br>
        <button type="submit">Log in</button>
    </form>
</div>

{% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <h1>Profile</h1>

    <p>
        <strong>Username:</strong>
        {{ user.username }}
    </p>

    <p>
        <strong>Email:</strong>
        {{ user.email }}
    </p>

    <p>
        <strong>Role:</strong>
        {{ role }}
    </p>

    <p>
        <strong>First name:</strong>
        {{ user.first_name|default:"Не указано" }}
    </p>

    <p>
        <strong>Last name:</strong>
        {{ user.last_name|default:"Не указана" }}
    </p>

    <p>
        <a href="{% url 'edit_profile' %}">
            Edit profile
        </a>
    </p>

    <p>
        <a href="/">
            ← Back to Home
        </a>
    </p>

    <p>
        <a href="{% url 'logout' %}">
            Log out
        </a>
    </p>

</div>

{% endblock %}
